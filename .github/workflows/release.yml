name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PCM Recon ${{ github.ref_name }}
          releaseBody: |
            Scouting, finances and kit editing for Pro Cycling Manager careers. Windows only.

            **Install:** download `PCM Recon_..._x64-setup.exe` below and run it. The `.msi` is the same app for managed installs.

            See the [README](https://github.com/Venutian/pcm-recon#readme) for what it does and how to edit a save safely.

            Support development on [Ko-fi](https://ko-fi.com/venutian).
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
