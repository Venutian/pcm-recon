<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- PCM Recon mark: a scouting lens over a stage profile, on maillot-jaune yellow. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#F0B400"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="1" stop-color="#FFE071"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
    <clipPath id="lensClip"><circle cx="440" cy="470" r="146"/></clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>

  <!-- the stage profile -->
  <g clip-path="url(#tileClip)">
    <path d="M40 760 L190 660 L290 712 L440 470 L560 610 L650 540 L770 664 L880 600 L1000 700 L1000 1000 L40 1000 Z" fill="#12161C"/>
  </g>

  <!-- magnified profile inside the lens -->
  <circle cx="440" cy="470" r="146" fill="url(#glass)"/>
  <g clip-path="url(#lensClip)">
    <path d="M280 560 L340 520 L378 548 L432 446 L470 492 L512 462 L600 540 L600 700 L280 700 Z" fill="#3A4558"/>
    <path d="M280 560 L340 520 L378 548 L432 446 L470 492 L512 462 L600 540" fill="none" stroke="#12161C" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M432 446 L432 392" stroke="#12161C" stroke-width="10" stroke-linecap="round"/>
    <path d="M434 393 L478 409 L434 425 Z" fill="#E8524A"/>
  </g>

  <!-- lens ring and handle -->
  <circle cx="440" cy="470" r="146" fill="none" stroke="#12161C" stroke-width="54"/>
  <path d="M556 356 L716 200" stroke="#12161C" stroke-width="76" stroke-linecap="round"/>
</svg>
